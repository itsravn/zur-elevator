<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zur Elevator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="elevator-wrapper">
        <div id="elevator-panel" class="panel-container">
            
            <div class="digital-screen">
                <span class="direction-arrow">▲</span>
                <span id="screen-text" class="screen-number">--</span>
            </div>
            
            <div class="panel-brand">ZUR ELEVATORS</div>
            
            <div id="floors-container" class="button-column">
            </div>

            <div class="speaker-grill">
                <div class="speaker-dot"></div><div class="speaker-dot"></div><div class="speaker-dot"></div><div class="speaker-dot"></div>
                <div class="speaker-dot"></div><div class="speaker-dot"></div><div class="speaker-dot"></div><div class="speaker-dot"></div>
                <div class="speaker-dot"></div><div class="speaker-dot"></div><div class="speaker-dot"></div><div class="speaker-dot"></div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
